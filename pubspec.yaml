name: al_toque
description: "Al Toque - Reserva de canchas deportivas en Huancayo, Perú"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  geolocator: ^14.0.1
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_riverpod: ^3.3.1
  permission_handler: ^12.0.1

  # Flutter Localizations
  flutter_localizations:
    sdk: flutter

  # UI
  google_fonts: ^8.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^1.2.0

  # HTTP
  http: ^1.2.2

  # Utilidades
  intl: ^0.20.2
  uuid: ^4.4.2
  share_plus: ^12.0.2

  # QR
  qr_flutter: ^4.1.0

  # Notificaciones locales
  flutter_local_notifications: ^21.0.0

  # Deep links
  app_links: ^7.0.0

  # Navegación
  go_router: ^17.2.2

  # Abrir URLs externas (Google Maps, WhatsApp, etc.)
  url_launcher: ^6.3.2

  # Device info (para verificar Android SDK version en runtime perms)
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
